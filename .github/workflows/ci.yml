---
name: "CI"

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker build
        run: "docker build -t pitch-io/clojure-dependabot:latest ."
      - name: Test
        run: 'docker run --rm -t -v "$PWD:/src" -w /src pitch-io/clojure-dependabot bb test:bb --profile ci'
