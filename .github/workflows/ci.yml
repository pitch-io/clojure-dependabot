---
name: "CI"

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache Clojure dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.deps.clj
          key: clojure-deps-${{ runner.os }}-${{ hashFiles('bb.edn') }}
          restore-keys: |
            clojure-deps-${{ runner.os }}-
      - name: Docker build
        run: "docker build -t pitch-io/clojure-dependabot:latest ."
      - name: Test
        run: 'docker run --rm -t -v "$PWD:/src" -w /src pitch-io/clojure-dependabot bb test:bb --profile ci'
